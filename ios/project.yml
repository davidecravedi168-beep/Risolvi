name: Risolvi
options:
  bundleIdPrefix: it.risolvi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Risolvi:
    type: application
    platform: iOS
    sources:
      - path: Risolvi
    info:
      path: Risolvi/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.risolvi.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      storeKitConfiguration: Risolvi.storekit
      testTargets: []
