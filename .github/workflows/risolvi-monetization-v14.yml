name: RISOLVI Monetization V14

on:
  pull_request:
    paths:
      - 'src/risolvi-monetization-v14.js'
      - 'scripts/upgrade_monetization_v14.py'
      - 'tests/risolvi-monetization-v14.test.cjs'
      - '.github/workflows/risolvi-monetization-v14.yml'
  push:
    branches: [main]
    paths:
      - 'src/risolvi-monetization-v14.js'
      - 'scripts/upgrade_monetization_v14.py'
      - 'tests/risolvi-monetization-v14.test.cjs'
      - '.github/workflows/risolvi-monetization-v14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  practice-pro-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wire unified Practice Pro product
        run: python scripts/upgrade_monetization_v14.py

      - name: Product and shell contracts
        run: |
          node --check src/risolvi-monetization-v14.js
          node tests/risolvi-monetization-v14.test.cjs
          node tests/risolvi-case-core.test.cjs
          node tests/risolvi-resolution-command.test.cjs
          node tests/risolvi-shell-contract.test.cjs
          node tests/risolvi-simple-ui-v13.test.cjs
          git diff --check

      - name: Persist generated web shell
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'RISOLVI V14 — sync Practice Pro monetization shell'
          git pull --rebase origin main
          git push origin HEAD:main
