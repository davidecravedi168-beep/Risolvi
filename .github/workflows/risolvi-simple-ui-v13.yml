name: RISOLVI Simple UI V13
on:
  push:
    branches: [main]
    paths:
      - 'src/risolvi-simple-ui-v13.js'
      - 'scripts/upgrade_simple_ui_v13.py'
      - 'tests/risolvi-simple-ui-v13.test.cjs'
      - '.github/workflows/risolvi-simple-ui-v13.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  simplify-test-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Wire action-first UI
        run: python scripts/upgrade_simple_ui_v13.py
      - name: Simple UI contract
        run: |
          node --check src/risolvi-simple-ui-v13.js
          node tests/risolvi-simple-ui-v13.test.cjs
          node tests/risolvi-case-core.test.cjs
          node tests/risolvi-resolution-command.test.cjs
          node tests/risolvi-shell-contract.test.cjs
          git diff --check
      - name: Persist simplified shell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'RISOLVI V13 — simplify action-first user interface'
          git pull --rebase origin main
          git push origin HEAD:main