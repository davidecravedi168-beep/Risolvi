name: Upgrade RISOLVI V8

on:
  push:
    branches: [main]
    paths:
      - "src/risolvi-case-core.js"
      - "src/risolvi-case-ui.css"
      - "src/risolvi-case-intelligence.js"
      - "tests/risolvi-case-core.test.cjs"
      - "tests/risolvi-shell-contract.test.cjs"
      - "scripts/upgrade_risolvi_v8.py"
      - ".github/workflows/upgrade-risolvi-v7.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/risolvi-case-core.js"
      - "src/risolvi-case-ui.css"
      - "src/risolvi-case-intelligence.js"
      - "tests/risolvi-case-core.test.cjs"
      - "tests/risolvi-shell-contract.test.cjs"
      - "scripts/upgrade_risolvi_v8.py"
      - ".github/workflows/upgrade-risolvi-v7.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: risolvi-v8-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded V8 migration and sync Worker shell
        run: python scripts/upgrade_risolvi_v8.py
      - name: Regression tests
        run: |
          node tests/risolvi-case-core.test.cjs
          node tests/risolvi-shell-contract.test.cjs
      - name: Syntax and contract checks
        run: |
          node --check src/risolvi-case-core.js
          node --check src/risolvi-case-intelligence.js
          node --check worker.js
          grep -q 'RISOLVI V8 — Premium Case Intelligence' index.html
          grep -q 'getIntelligenceState' index.html
          grep -q 'RISOLVI_CASE_UI_V8' worker.js
          grep -q '8.0.0-premium-case-intelligence' worker.js
          grep -q '2026-08-29.1' worker.js
          grep -q 'PRIORITÀ' worker.js
          git diff --check
      - name: Publish tested RISOLVI V8
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet; then
            echo 'No migration changes to publish'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html worker.js
          git commit -m 'RISOLVI V8 — premium explainable case cockpit'
          git push origin HEAD:main
