name: iOS Simulator Gate

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-simulator-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate StoreKit test catalog
        working-directory: ios
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('Risolvi.storekit').read_text())
          products = data.get('products', [])
          assert len(products) == 1, 'Expected exactly one StoreKit test product'
          product = products[0]
          assert product['productID'] == 'it.risolvi.practice.pro'
          assert product['type'] == 'Consumable'
          assert product['displayPrice'] == '6.99'
          assert data.get('version', {}).get('major', 0) >= 2
          print('StoreKit catalog: OK')
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Verify StoreKit scheme wiring
        working-directory: ios
        run: |
          grep -q 'StoreKitConfigurationFileReference' Risolvi.xcodeproj/xcshareddata/xcschemes/Risolvi.xcscheme
          grep -q 'Risolvi.storekit' Risolvi.xcodeproj/xcshareddata/xcschemes/Risolvi.xcscheme

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Risolvi.xcodeproj \
            -scheme Risolvi \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build
